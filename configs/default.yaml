# Model ids, per-token prices and seed/temperature support checked against
# OpenRouter's live /api/v1/models on 2026-10-26 with `aipc prices`, which
# exits 1 on any mismatch. Run it before every paid step; prices drift.
#
# supports_seed / supports_temperature: OpenRouter silently drops a
# parameter the model doesn't support, so the Claude 5.x models (neither)
# are sent neither, and their calls record sampling_sent = "".
#
# "cheap" is anthropic/claude-haiku-5.5 with reasoning switched off. With
# reasoning left on it billed ~5x its visible output; with it off a call
# costs ~1.6x gpt-4o-mini, because it bills ~2 tokens per word.
models:
  cheap:    { id: "anthropic/claude-haiku-5.5", usd_per_mtok_in: 0.10, usd_per_mtok_out: 0.50, reasoning: false, supports_seed: false, supports_temperature: false }
  # Reasoning set explicitly per tier. Opus 5.5 cannot switch it off:
  # OpenRouter returns 400 "Reasoning is mandatory for this endpoint"
  # (probe, 2026-10-21), so the frontier tier always reasons and the cheap
  # tier does not. Sonnet 5.5 was not probed.
  standard: { id: "anthropic/claude-sonnet-5.5", usd_per_mtok_in: 2.0,  usd_per_mtok_out: 10.0, reasoning: true, supports_seed: false, supports_temperature: false }
  frontier: { id: "anthropic/claude-opus-5.5",   usd_per_mtok_in: 4.0,  usd_per_mtok_out: 20.0, reasoning: true, supports_seed: false, supports_temperature: false }
  # Component-ladder judge candidates, separate from the generation tiers and from
  # a different family than the generator (now Claude, so not judge_opus46). `aipc judge-select`
  # picks one. Prices verified against /api/v1/models on 2026-10-09.
  judge_qwen:   { id: "qwen/qwen3-30b-a3b-instruct-2507", usd_per_mtok_in: 0.10, usd_per_mtok_out: 0.30 }
  judge_gemini: { id: "google/gemini-2.5-flash",          usd_per_mtok_in: 0.30, usd_per_mtok_out: 2.50 }
  judge_opus46: { id: "anthropic/claude-opus-4.6",        usd_per_mtok_in: 5.00, usd_per_mtok_out: 25.00, supports_seed: false }
  # Frontier-phase judge candidates: not Claude, because Claude generates.
  # Both are reasoning models, so hidden reasoning tokens can push real
  # cost above the dry-run estimate. gpt-5.6-sol was $2/$10 on 2026-10-13
  # and is $4/$20 on 2026-10-21.
  judge_gemini31pro: { id: "google/gemini-3.1-pro-preview", usd_per_mtok_in: 2.00, usd_per_mtok_out: 12.00 }
  judge_gpt56sol:    { id: "openai/gpt-5.6-sol",            usd_per_mtok_in: 4.00, usd_per_mtok_out: 20.00, supports_temperature: false }

# temperature applies only where a model supports it (see supports_*). The
# judges keep 1.0: Google advises against lowering it for Gemini 3 models
# (looping, degraded reasoning), and gpt-5.6-sol accepts no temperature.
defaults:
  tier: cheap
  temperature: 1.0
  seed: 1

# Prompt file the neutral ladder judge uses, in both judge-select and the
# tournament. Pick the one that passes judge selection.
judge_prompt: judge_pairwise_reasoned

limits:
  # A per-run safety net. An experiment's real cap is `experiment --budget`;
  # a tournament's is `--max-cost`. Raised from 5.0 on 2026-10-21: a
  # frontier D essay's dry-run upper bound is about $6.
  max_cost_usd: 10.0
  # Body words, excluding title and references. The contest allows 6,000
  # words per essay, and no source confirms that references are excluded
  # (checked 2026-10-13), so the target leaves room for a reference list.
  # Lowered from [5000, 5400] on 2026-10-26 for the contest essay: an Opus
  # 5.5 probe ran 5% over its maximum and reached 5,880 words with its
  # references, and the pipeline revises up to three times. An experiment
  # can set its own target_words.
  target_words: [4600, 5000]

pipeline:
  # Which Decomposition -> ContentLedger strategy runs - "flat" (one
  # direct call per sub-question) or "debate_room" (Manager + two
  # position-defined debaters). A config change, not a code branch.
  strategy: flat
  critics: 3
  max_revision_rounds: 3
  ideation_candidates: 3
  decomposition_candidates: 4
  # The manager's convergence check runs only from debate_min_rounds on;
  # checked after round 1 it tends to stop a debate after one exchange.
  debate_min_rounds: 2
  debate_max_rounds: 3
